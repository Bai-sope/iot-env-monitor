<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#5a6b7d"/>
    </marker>
    <style>
      .box { fill:#eaf2fb; stroke:#1f4e79; stroke-width:1.5; rx:6; }
      .box2 { fill:#fff7e6; stroke:#c55a11; stroke-width:1.5; rx:6; }
      .box3 { fill:#eef7ee; stroke:#006100; stroke-width:1.5; rx:6; }
      .lbl { font-family:"Microsoft YaHei",sans-serif; font-size:13px; fill:#1a1a1a; text-anchor:middle; }
      .sub { font-family:"Microsoft YaHei",sans-serif; font-size:10px; fill:#666; text-anchor:middle; }
      .ttl { font-family:"Microsoft YaHei",sans-serif; font-size:15px; font-weight:bold; fill:#1f4e79; }
      .ln { stroke:#5a6b7d; stroke-width:1.5; fill:none; marker-end:url(#arrow); }
    </style>
  </defs>

  <text x="20" y="28" class="ttl">IoT 环境监测平台 · 系统架构</text>

  <!-- 感知层 -->
  <rect x="30" y="60" width="150" height="90" class="box"/>
  <text x="105" y="90" class="lbl">ESP32 节点</text>
  <text x="105" y="110" class="sub">DHT22 温湿度</text>
  <text x="105" y="126" class="sub">GP-2Y PM2.5</text>
  <text x="105" y="142" class="sub">SCT-013 电流</text>

  <!-- MQTT -->
  <rect x="240" y="60" width="140" height="90" class="box2"/>
  <text x="310" y="90" class="lbl">EMQX Broker</text>
  <text x="310" y="110" class="sub">MQTT 3.1.1</text>
  <text x="310" y="126" class="sub">QoS 1 / LWT</text>
  <text x="310" y="142" class="sub">:1883</text>

  <!-- 后端 -->
  <rect x="440" y="60" width="180" height="90" class="box"/>
  <text x="530" y="90" class="lbl">Spring Boot</text>
  <text x="530" y="110" class="sub">Paho MQTT 订阅</text>
  <text x="530" y="126" class="sub">幂等去重 / 告警检查</text>
  <text x="530" y="142" class="sub">:8080</text>

  <!-- 存储层 -->
  <rect x="180" y="220" width="140" height="70" class="box3"/>
  <text x="250" y="248" class="lbl">MySQL 8</text>
  <text x="250" y="268" class="sub">设备 / 告警规则</text>

  <rect x="350" y="220" width="140" height="70" class="box3"/>
  <text x="420" y="248" class="lbl">InfluxDB 2</text>
  <text x="420" y="268" class="sub">时序点位</text>

  <rect x="520" y="220" width="140" height="70" class="box3"/>
  <text x="590" y="248" class="lbl">Redis</text>
  <text x="590" y="268" class="sub">幂等 / 最新值缓存</text>

  <!-- 前端 -->
  <rect x="700" y="220" width="150" height="70" class="box2"/>
  <text x="775" y="248" class="lbl">Vue 3 前端</text>
  <text x="775" y="268" class="sub">ECharts 看板</text>

  <!-- 连线 -->
  <line x1="180" y1="105" x2="238" y2="105" class="ln"/>
  <line x1="380" y1="105" x2="438" y2="105" class="ln"/>
  <line x1="490" y1="150" x2="270" y2="218" class="ln"/>
  <line x1="530" y1="150" x2="430" y2="218" class="ln"/>
  <line x1="560" y1="150" x2="580" y2="218" class="ln"/>
  <line x1="620" y1="255" x2="698" y2="255" class="ln"/>

  <text x="205" y="98" class="sub">MQTT</text>
  <text x="405" y="98" class="sub">订阅</text>

  <!-- 数据流说明 -->
  <text x="30" y="350" class="ttl">数据流</text>
  <text x="30" y="375" class="sub" text-anchor="start">传感器 → ESP32（10s 采样）→ MQTT QoS1 → 后端订阅 → 幂等去重 → 分流写 MySQL / InfluxDB → 前端查询展示</text>
  <text x="30" y="400" class="sub" text-anchor="start">掉线检测：KeepAlive 60s + 遗嘱消息，Broker 在 90s 后代发 {"online":false} → 后端标记离线并触发告警</text>
  <text x="30" y="425" class="sub" text-anchor="start">告警：每条上行消息检查规则 → 支持持续时长 → Redis 防抖 5 分钟</text>
</svg>
